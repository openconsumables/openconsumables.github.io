xiaomi-4-6-filter-family:
  display_name: Xiaomi 4 / Mijia 6 replacement-filter group
  aftermarket_aliases:
  - M16R-FLP-GL
  - AFEP8TFM25-GL
  status: unmeasured
  baseline: null
  notes: The AFEP8TFM25-GL filter is explicitly listed for both the Mijia Smart Air Purifier 6 and Xiaomi
    Smart Air Purifier 4 in [Xiaomi specifications](https://www.mi.com/global/product/mijia-smart-air-purifier-6-filter/specs/).
    This is a working grouping, not a claim that every filter for either device is interchangeable. In
    particular, M16R-FLP-GL has only a recorded claim for the 4. Geometry and electronics have not been
    measured.
