notes: 'G30LP is a distinct MAX model, not a regional alias of G30P. Its OEM manual states tire label
  60/70-6.5; this does not establish that a G30P tire or deck mat fits.


  US recall recorded in this reference on 2026-09-11: CPSC notice 25-193, issued 2025-03-20, covers
  MAX G30P and MAX G30LP folding mechanisms. The notice instructs owners to stop using affected scooters
  and contact Segway for the inspection and maintenance-kit remedy. See the [CPSC recall notice](https://www.cpsc.gov/Recalls/2025/Segway-Recalls-Segway-Ninebot-Max-G30P-and-Max-G30LP-KickScooters-Due-to-Fall-Hazard-and-Risk-of-Serious-Injury)
  and [Segway recall page](https://service.segway.com/us-en/g30RecallNotice). This is an older notice
  newly recorded here; no global recall scope is inferred.'
