# Working compatibility groups, not measured baselines.
xiaomi-mes601-family:
  display_name: Xiaomi T300 / T500 documented head family
  aftermarket_aliases:
  - MES601
  - MES602
  charging: varies
  status: unmeasured
  baseline: null
  notes: |
    Xiaomi lists the MBS301 Gum Care head for T300 and T500. T300 uses USB-C
    while T500 uses an inductive dock; charging is not the grouping criterion.
    No T700, T301/T302, T501 or Oscillation cross-fit is asserted.
xiaomi-mes606-family:
  display_name: Xiaomi T200 / MES606
  aftermarket_aliases:
  - MES606
  charging: usb-c
  status: unmeasured
  baseline: null
  notes: |
    T200 replacement-head family supported here by model-specific retailer
    evidence. Charging architecture is not evidence of socket geometry.
    T100 or other T-series cross-fit is unverified.
xiaomi-mes603-family:
  display_name: Xiaomi T100 / MES603
  aftermarket_aliases:
  - MES603
  charging: unknown
  status: unmeasured
  baseline: null
  notes: |
    Reserved T100 working family. No shared mount with T200 is established.
    The earlier USB-C claim has been removed pending attributable evidence.
xiaomi-mes608-family:
  display_name: Xiaomi T301 / T302 documented head family
  aftermarket_aliases:
  - MES605
  - MES608
  charging: varies
  status: unmeasured
  baseline: null
  notes: |
    Xiaomi China names T301 and T302 on one standard replacement-head listing.
    The global T302 head is MBS303. T501 grouping remains unverified here.
xiaomi-mes607-family:
  display_name: Xiaomi T501 / MES607
  aftermarket_aliases:
  - MES607
  charging: inductive
  status: unmeasured
  baseline: null
  notes: |
    T501 is documented with MBS307 White Pro heads. A separate working profile
    records the confirmed fit; it does not prove incompatibility with T301/T302.
xiaomi-mes604-family:
  display_name: Xiaomi T700 / MES604
  aftermarket_aliases:
  - MES604
  charging: inductive
  status: unmeasured
  baseline: null
  notes: |
    T700 is documented with MBS304 heads. No official shared-head evidence with
    T300/T500 was captured, so it is kept separate pending better evidence.
xiaomi-oscillation-family:
  display_name: Xiaomi Oscillation Clean / Soft head family
  aftermarket_aliases:
  - MES609
  - MES610
  - MES613
  - MBS308
  - MBS309
  charging: usb-c
  status: unmeasured
  baseline: null
  notes: |
    Manufacturer product and package descriptions identify Clean MBS308 and
    Soft MBS309 heads. Each handle page lists only the supported fit claims.
    Xiaomi explicitly excludes T300, T500, T501 and T302 heads for Oscillation
    Pro. This remains an unmeasured reference grouping.
oclean-adult:
  display_name: Oclean adult toothbrush head family
  aftermarket_aliases: []
  charging: varies
  status: unmeasured
  baseline: null
  notes: |
    Oclean states Ultra Series heads fit all Oclean adult toothbrushes. This
    manufacturer claim does not establish children's-head or cross-brand fit.
soocas-neos:
  display_name: Soocas NEOS II / NEOS II Ultra
  aftermarket_aliases:
  - T04
  - T04 Ultra
  - C02
  - C04
  charging: inductive
  status: unmeasured
  baseline: null
  notes: |
    Soocas replacement-head pages name NEOS II and NEOS II Ultra. Head manuals
    identify C02 Classic Clean and C04 Ultra Clean / Ultra Soft. No older
    Soocas X-series or Xiaomi head fit is inferred.
oral-b-classic:
  display_name: Oral-B classic round-head mount
  aftermarket_aliases: []
  charging: varies
  status: unmeasured
  baseline: null
  notes: |
    Oral-B lists CrossAction and Precision Clean for rechargeable rotating-
    oscillating handles, excluding iO and Pulsonic. Included as reference only.
oral-b-io:
  display_name: Oral-B iO mount
  aftermarket_aliases: []
  charging: inductive
  status: unmeasured
  baseline: null
  notes: |
    Oral-B excludes iO from classic CrossAction and Precision Clean head fit.
    No iO fit claim or measured geometry is published in this profile.
