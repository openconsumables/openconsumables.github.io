  - 磁吸式刀头组件
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Huawei Vmall product title for the T3 head accessory says it fits
    standard, premium, and T3 named editions. This is a narrow,
    Huawei-ecosystem-specific anchor rather than a broad ShowSee family.
    Magnetic quick-release head ("磁吸式刀头组件") may be a separate
    retention class from the passive latched rotary lane; treat as
    distinct from F1 / F303-BK and F305 families.
