# Working head profiles, not measured baselines.
xiaomi-mijia-s300-s500-rotary:
  display_name: Xiaomi / Mijia S300-S500 rotary 3-blade
  aftermarket_aliases:
  - S300/S500/S500C 刀头
  - S300/S500/MJTXD01SKS 通用机头
  - 米家电动剃须刀刀头
  - Mijia S300 S500 replacement head
  - 内5角
  - 五角形转轴口
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Working shared-head group based on an authorized retailer naming S300,
    S500 and S500C. Xiaomi global directly names S500 only. Broader legacy
    MJTXD01SKS and generic-head claims remain marketplace evidence with
    unresolved sources; no measured geometry or cross-brand fit is established.
xiaomi-mijia-s101-rotary:
  display_name: Xiaomi / Mijia S101 rotary 3-blade
  aftermarket_aliases:
  - Xiaomi Electric Shaver S101 Replacement Head
  - 米家电动剃须刀刀头 S101
  - S101 刀头
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Dedicated head per Xiaomi's S101 global / HK accessory page; the
    replacement-head listing names S101 only. Some Chinese marketplace
    titles broaden to "S101 S300 S301 S500 S700" but those should not be
    trusted as cross-fits without physical or official confirmation.
    Aftermarket listings occasionally group S101 with S301; the S301
    grouping is marketplace-claim only.
xiaomi-mijia-s302-rotary:
  display_name: Xiaomi / Mijia S302 rotary 3-blade
  aftermarket_aliases:
  - 米家电动剃须刀刀头 S302
  - S302 刀头
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Separate S302 head named by a JD retailer. The former Xiaomi numeric
    store source could not be recovered as stable product evidence, so the
    current fit is marketplace-claim only. No S301 or S300/S500 cross-fit is
    established, and no measured geometry is published.
xiaomi-mijia-s700-ceramic-rotary:
  display_name: Xiaomi / Mijia S700 ceramic rotary 3-blade
  aftermarket_aliases:
  - Xiaomi Electric Shaver S700 Replacement Head
  - S700 刀头
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Xiaomi's S700 replacement head page restricts the head to the S700
    body. Ceramic cutter material introduces additional handling and supply
    considerations vs. stainless-steel rotary heads. Treat as a dedicated
    family, not part of the S300 / S500 cluster.
enchen-br1-rotary:
  display_name: ENCHEN BR-1 rotary 3-blade
  aftermarket_aliases:
  - BR-1
  - Blackstone / Blackstone-C / Warrior replacement head
  - ENCHEN BlackStone shaver blade
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Strongest head-code anchor in the OpenShave cluster. Export retailers
    (Galaxus, Pepita, Shopmobile, MiOT Global, Aquario) list BR-1 as the
    replacement head for ENCHEN BlackStone, BlackStone-C, and Warrior; the
    code appears in product titles, reference fields, and article-number
    fields. Chinese official-channel evidence for BR-1 was not captured in
    the desk pass, so the manufacturer-level fitment list is marketplace-
    claim, not manufacturer-claim. One source had inconsistent prose
    mentioning a "Warrior BR-2"; treat as seller noise pending verification.
enchen-br3-rotary:
  display_name: ENCHEN BR-3 rotary 3-blade
  aftermarket_aliases:
  - BR-3
  - BlackStone 3 / Gentleman 3S / Gentleman 5S / Steel 3S replacement head
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    BR-3 head-code family documented by Anodas retailer for BlackStone 3,
    Gentleman 3S, Gentleman 5S and Steel 3S. Manufacturer fit confirmation and
    physical interchangeability remain unverified. No BR-1 cross-fit is implied.
enchen-yx0032-magnetic-rotary:
  display_name: ENCHEN BlackStone 7 / YX0032 magnetic rotary
  aftermarket_aliases:
  - YX0032
  - 映趣 Blackstone 7
  - 磁吸式刀头
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    Chinese retail page for BlackStone 7 / YX0032 describes a magnetic
    quick-release head ("磁吸式刀头") with a 3D floating-head architecture
    and dual-ring curved foil overlay. No replacement-head SKU was captured
    in the desk pass. Magnetic retention is a separate interface class
    from passive latched rotary; do not assume BR-1 or BR-3 fits this body.
soocas-sp1-rotary:
  display_name: Soocas SP1 compact (style unresolved)
  aftermarket_aliases:
  - SP1 replacement head
  - 素士口袋电动剃须刀 SP1
  charging: usb-c-or-base
  status: unmeasured
  baseline: null
  notes: |
    SP1 is the Soocas pocket / portable shaver. Pinkoi listing names SP1
    replacement head and says only for SP1, but the style (foil vs. rotary
    single vs. hybrid) was not resolved in the desk pass. Kept as a
    separate slot until the head shape is confirmed.
